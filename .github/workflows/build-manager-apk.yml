name: Build AGH Manager APK

on:
  push:
    branches:
      - feat/agh-manager-apk
    paths:
      - 'manager-app/**'
      - '.github/workflows/build-manager-apk.yml'
  pull_request:
    branches:
      - feat/box-dual-dns
    paths:
      - 'manager-app/**'
      - 'src/scripts/tool.sh'
      - '.github/workflows/build-manager-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o "$RUNNER_TEMP/cmdline-tools.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/cmdline-tools-unpack"
          mv "$RUNNER_TEMP/cmdline-tools-unpack/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: manager-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp manager-app/app/build/outputs/apk/debug/app-debug.apk out/AGH-Manager-v0.2.0-rc1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AGH-Manager-v0.2.0-rc1
          path: out/AGH-Manager-v0.2.0-rc1-debug.apk
          if-no-files-found: error
