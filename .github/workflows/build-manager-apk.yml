name: Build AGH Manager APK

on:
  push:
    branches:
      - feat/agh-manager-apk
    paths:
      - 'manager-app/**'
      - '.github/workflows/build-manager-apk.yml'
  pull_request:
    branches:
      - feat/box-dual-dns
    paths:
      - 'manager-app/**'
      - 'src/scripts/tool.sh'
      - '.github/workflows/build-manager-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: manager-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp manager-app/app/build/outputs/apk/debug/app-debug.apk out/AGH-Manager-v0.1.0-rc1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AGH-Manager-APK
          path: out/AGH-Manager-v0.1.0-rc1-debug.apk
          if-no-files-found: error
