# 集成模式:
# standalone: 保持原模块单实例行为，可由本模块安装全局 DNS iptables 规则
# box-dual: 与 chenyurumeng/box 的 split-apps 模式配合，双实例运行，iptables 完全交给 Box
integration_mode=box-dual

# standalone 模式下是否启用内置 iptables；box-dual 模式会被代码强制禁用
enable_iptables=true

# standalone 模式 IPv6 DNS 处理
block_ipv6_dns=true

# standalone 模式重定向端口
redir_port=5591

# box-dual 国内实例
domestic_enabled=true
domestic_dns_port=5591
domestic_web_port=3000

# box-dual 国外实例
foreign_enabled=true
foreign_dns_port=5592
foreign_web_port=3001

# DNS 监听启动等待时间
startup_timeout=120

# AdGuard Home 运行用户/用户组。
# Box 会使用 root:net_raw 识别 AGH 上游流量并对指定 DNS endpoint 做 DIRECT bypass。
adg_user=root
adg_group=net_raw

# standalone iptables 绕过列表
ignore_dest_list=""
ignore_src_list=""

timezone="Asia/Shanghai"

# 文件路径，请勿修改
readonly AGH_DIR="/data/adb/agh"
readonly BIN_DIR="$AGH_DIR/bin"
readonly SCRIPT_DIR="$AGH_DIR/scripts"
readonly INSTANCE_DIR="$AGH_DIR/instances"
readonly PID_FILE="$AGH_DIR/bin/agh.pid"
readonly MOD_PATH="/data/adb/modules/AdGuardHome"
