plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def releaseStoreFilePath = System.getenv("MANAGER_RELEASE_STORE_FILE")
def releaseStorePassword = System.getenv("MANAGER_RELEASE_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("MANAGER_RELEASE_KEY_ALIAS")
def releaseKeyPassword = System.getenv("MANAGER_RELEASE_KEY_PASSWORD")
def hasReleaseSigning = [
    releaseStoreFilePath,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword
].every { it != null && !it.trim().isEmpty() }

android {
    namespace 'io.github.chenyurumeng.aghmanager'
    compileSdk 35

    defaultConfig {
        applicationId "io.github.chenyurumeng.aghmanager"
        minSdk 26
        targetSdk 35
        versionCode 30
        versionName "0.5.0-rc20"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures { compose true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    packaging {
        resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' }
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
    implementation composeBom
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'org.mindrot:jbcrypt:0.4'
    testImplementation 'junit:junit:4.13.2'
}


gradle.taskGraph.whenReady { graph ->
    def releasePackagingRequested = graph.allTasks.any { task ->
        task.project == project && (
            task.name == 'assembleRelease' ||
            task.name == 'packageRelease' ||
            task.name == 'bundleRelease'
        )
    }
    if (releasePackagingRequested && !hasReleaseSigning) {
        throw new GradleException(
            "Release packaging requires MANAGER_RELEASE_STORE_FILE, " +
                "MANAGER_RELEASE_STORE_PASSWORD, MANAGER_RELEASE_KEY_ALIAS, " +
                "and MANAGER_RELEASE_KEY_PASSWORD."
        )
    }
}
